spring.application.name=linked-in-backend-backend
spring.jpa.open-in-view=false
spring.profiles.active=dev

app.auth-disabled=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jackson.serialization.write-dates-as-timestamps=false
#spring.jpa.hibernate.use-new-id-generator-mappings=false | Deprecated
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Athens
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
spring.data.web.pageable.max-page-size=5000

spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.time=HH:mm:ss

